<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Wide News</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>🌍 World Wide News</h1>
        <p class="subtitle">High‑signal world news, updated by your agent</p>
    </header>

    <section id="global-overview" class="panel">
        <h2>Global Overview</h2>
        <div id="global-stories" class="stories"></div>
    </section>

    <section id="regions">
        <div class="region-panel" id="north-america">
            <h3>North America</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="latin-america">
            <h3>Latin America</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="east-asia">
            <h3>East Asia</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="south-asia">
            <h3>South Asia</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="europe">
            <h3>Europe</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="middle-east">
            <h3>Middle East</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="africa">
            <h3>Africa</h3>
            <div class="stories"></div>
        </div>

        <div class="region-panel" id="oceania">
            <h3>Oceania</h3>
            <div class="stories"></div>
        </div>
    </section>

    <script src="dashboard.js"></script>
</body>
</html>
